<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">TipTap by KelsonCM</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1351b4"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Toolbar: three buttons. -->
  <g fill="#ffffff" fill-opacity="0.55">
    <rect x="104" y="96" width="64" height="48" rx="14"/>
    <rect x="184" y="96" width="64" height="48" rx="14"/>
    <rect x="264" y="96" width="64" height="48" rx="14"/>
  </g>
  <!-- The letter T of the text being edited. -->
  <g fill="#ffffff">
    <rect x="104" y="192" width="232" height="56" rx="16"/>
    <rect x="192" y="192" width="56" height="224" rx="16"/>
  </g>
  <!-- Text cursor. -->
  <rect x="360" y="264" width="28" height="152" rx="14" fill="#ffffff" fill-opacity="0.8"/>
</svg>
